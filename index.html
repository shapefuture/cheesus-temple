class AudioContextManager {
  static instance = null;
  static context = null;
  static isInitialized = false;
  
  static async getContext() {
    if (!this.context) {
      try {
        this.context = new (window.AudioContext || window.webkitAudioContext)();
        console.log("🎵 AudioContext created successfully");
      } catch (error) {
        console.error("❌ AudioContext creation failed:", error);
        return null;
      }
    }
    
    if (this.context.state === 'suspended') {
      try {
        await this.context.resume();
        console.log("🎵 AudioContext resumed successfully");
      } catch (error) {
        console.error("❌ AudioContext resume failed:", error);
      }
    }
    
    this.isInitialized = true;
    return this.context;
  }
  
  static async ensureUnlocked() {
    const context = await this.getContext();
    if (!context) return false;
    
    if (context.state === 'suspended') {
      // Create silent buffer to unlock
      const buffer = context.createBuffer(1, 1, 22050);
      const source = context.createBufferSource();
      source.buffer = buffer;
      source.connect(context.destination);
      source.start();
      
      try {
        await context.resume();
        console.log("🎵 AudioContext unlocked successfully");
        return true;
      } catch (error) {
        console.error("❌ AudioContext unlock failed:", error);
        return false;
      }
    }
    
    return true;
  }
  
  static dispose() {
    if (this.context && this.context.state !== 'closed') {
      this.context.close();
      this.context = null;
      this.isInitialized = false;
      console.log("🎵 AudioContext disposed");
    }
  }
}

class CinematicLoadingManager {
  constructor(onProgress, onComplete) {
    this.progress = 0;
    this.messages = [];
    this.onProgressCallback = onProgress;
    this.onCompleteCallback = onComplete;
    this.loadingSteps = [
      "Initializing sacred protocols...",
      "Blessing the holy textures...",
      "Manifesting divine geometry...",
      "Calibrating celestial lighting...",
      "Tuning sacred harmonics...",
      "Preparing mystical particles...",
      "Finalizing temple experience...",
      "Opening sacred doors...",
    ];
    this.currentStep = 0;
    this.updateQueue = [];
    this.isProcessing = false;
    
    console.log("🍞 Loading: Enhanced loading manager initialized");
  }
  updateProgress(increment, message) {
    this.updateQueue.push({ increment, message, timestamp: Date.now() });
    this.processQueue();
  }
  async processQueue() {
    if (this.isProcessing || this.updateQueue.length === 0) return;
    
    this.isProcessing = true;
    
    while (this.updateQueue.length > 0) {
      const update = this.updateQueue.shift();
      
      this.progress = Math.min(100, this.progress + update.increment);
      
      if (update.message) {
        this.messages.push(`✨ ${update.message}`);
        if (this.messages.length > 3) this.messages.shift();
      }
      
      // Update step based on progress
      const expectedStep = Math.floor((this.progress / 100) * this.loadingSteps.length);
      if (expectedStep > this.currentStep && expectedStep < this.loadingSteps.length) {
        this.currentStep = expectedStep;
        this.messages.push(`🍞 ${this.loadingSteps[this.currentStep]}`);
        if (this.messages.length > 3) this.messages.shift();
      }
      
      // Call callback
      this.onProgressCallback(this.progress, [...this.messages]);
      
      // Add small delay for smoother animation
      await new Promise(resolve => setTimeout(resolve, 100));
      
      if (this.progress >= 100) {
        setTimeout(() => {
          this.messages.push("🙏 Sacred temple ready for worship!");
          this.onProgressCallback(100, [...this.messages]);
          setTimeout(() => this.onCompleteCallback(), 800);
        }, 200);
        break;
      }
    }
    
    this.isProcessing = false;
  }
  setComplete() {
    this.updateProgress(100 - this.progress, "Divine manifestation complete!");
  }
}

        constructor() {

          this.applyCurrentOption();
        }
        switchOption(direction) {
          if (!this.hero) return;
          this.currentOption = (this.currentOption + direction + this.options.length) % this.options.length;
          console.log(`🍞 TextureFit: Switched to option: ${this.options[this.currentOption].name}`);
          this.applyCurrentOption();
        }
        updateUI() {
          if (this.optionNameElement) {
            this.optionNameElement.textContent = this.options[this.currentOption].name;
          }
        }
        applyCurrentOption() {
          if (!this.hero || !this.originalGeometry) return;
          // Always start from a fresh copy of the original geometry to prevent cumulative transforms
          this.hero.geometry.dispose();
          this.hero.geometry = this.originalGeometry.clone();
          const opt = this.options[this.currentOption];
          this.updateUI();
          this.applyUvTransform(opt.scale, opt.rotation, opt.center);
        }
        applyUvTransform(scale, rotation, center) {
          const geom = this.hero.geometry;
          const uvAttr = geom.attributes.uv;
          const uv = uvAttr.array;
          const [cx, cy] = center;
          const s = scale;
          const cosR = Math.cos(rotation);
          const sinR = Math.sin(rotation);
          for (let i = 0; i < uv.length; i += 2) {
            let u = uv[i] - cx;
            let v = uv[i + 1] - cy;
            const ru = u * cosR - v * sinR;
            const rv = u * sinR + v * cosR;
            u = ru * s;
            v = rv * s;
            uv[i] = u + cx;
            uv[i + 1] = v + cy;
          }
          uvAttr.needsUpdate = true;
        }
      }

  // Cancel animation

    this.animationId = null;

  if (this.audioManager) {

  }

  AudioContextManager.dispose();

    this.gyroController = null;
  }

  if (this.messageTimeout) {
    clearTimeout(this.messageTimeout);
    this.messageTimeout = null;
  }
  
  if (this.resizeTimeout) {
    clearTimeout(this.resizeTimeout);
    this.resizeTimeout = null;
  }
  
  // Remove event listeners
  window.removeEventListener("resize", this.onResize);
  
  // Clean up DOM elements
  if (this.messageElement) {
    this.messageElement.remove();
    this.messageElement = null;
  }
  
  // Clear global references
  if (window.audioManagerRef) {
    window.audioManagerRef.current = null;
  }
  
  // Dispose Three.js resources
  if (this.scene) {
    this.scene.traverse((object) => {
      if (object.geometry) {
        object.geometry.dispose();
      }
      if (object.material) {
        if (Array.isArray(object.material)) {
          object.material.forEach(material => material.dispose());
        } else {
          object.material.dispose();
        }
      }
    });
    this.scene.clear();
  }
  
  // Dispose renderer and composer
  if (this.renderer) {
    this.renderer.dispose();
    this.renderer = null;
  }
  
  if (this.composer) {
    this.composer.dispose();
    this.composer = null;
  }
  
  console.log("🍞 Experience: Cleanup complete");

// Enhanced Mobile Optimization
class MobileOptimizer {
  constructor() {
    this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    this.isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    this.screenSize = Math.max(window.screen.width, window.screen.height);
    
    console.log("📱 Mobile: Detected device -", {
      isMobile: this.isMobile,
      isIOS: this.isIOS,
      pixelRatio: this.pixelRatio,
      screenSize: this.screenSize
    });
  }
  getOptimizedSettings() {
    if (!this.isMobile) {
      return {
        shadowMapSize: 2048,
        particleCount: 800,
        bloomStrength: 1.0,
        antiAlias: true,
        pixelRatio: Math.min(this.pixelRatio, 2),
      };
    }
    // Mobile optimizations
    return {
      shadowMapSize: this.screenSize > 1024 ? 1024 : 512,
      particleCount: this.screenSize > 1024 ? 300 : 150,
      bloomStrength: 0.6,
      antiAlias: false,
      pixelRatio: Math.min(this.pixelRatio, 1.5),
    };
  }
  optimizeForMobile() {
    if (!this.isMobile) return;
    // Disable hover effects on mobile
    const style = document.createElement('style');
    style.textContent = `
      @media (hover: none) {
        button:hover {
          transform: none !important;
          box-shadow: none !important;
        }
        input:hover {
          transform: none !important;
          border-color: inherit !important;
        }
      }
    `;
    document.head.appendChild(style);
    // Add touch-friendly styles
    document.body.style.touchAction = 'pan-x pan-y';
    document.body.style.webkitTouchCallout = 'none';
    document.body.style.webkitUserSelect = 'none';
  }
}
